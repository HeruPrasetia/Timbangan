name: Build Electron Windows
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    # Mengunci runner ke Windows Server 2022 yang stabil
    runs-on: windows-2022
    permissions:
      contents: write

    env:
      GYP_MSVS_VERSION: '2022'
      npm_config_msvs_version: '2022'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Menggunakan MSBuild resmi milik Microsoft Actions
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Dependencies
        run: npm install

      # Bypass pencarian PowerShell yang overflow dengan memanggil vcvarsall.bat langsung di CMD
      - name: Rebuild Native Modules
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          npm run rebuild -- --msvs_version=2022
        env:
          npm_config_msvs_version: '2022'

      - name: Build React Frontend
        run: npm run build-react

      - name: Build and Release Electron App
        run: npm run buildwin -- -p always 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Timbangan-EXE
          path: dist/*.exe